<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry Received | Lyton Mupanga</title>

    <meta name="description"
          content="Your enquiry has been successfully received by Lyton Mupanga.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top right, rgba(194, 157, 75, 0.12), transparent 35%),
                #080808;
            color: #f4f0e8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .success-wrapper {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            margin-bottom: 36px;
            border: 1px solid #b99545;
            color: #d8b86a;
            font-family: Georgia, serif;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .eyebrow {
            margin-bottom: 18px;
            color: #d8b86a;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 24px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(48px, 9vw, 82px);
            line-height: 0.95;
            font-weight: 500;
        }

        .message {
            max-width: 570px;
            margin: 0 auto 38px;
            color: #bdb8ae;
            font-size: 18px;
            line-height: 1.8;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 38px;
            padding: 12px 18px;
            border: 1px solid rgba(216, 184, 106, 0.25);
            background: rgba(216, 184, 106, 0.06);
            color: #ddd5c5;
            font-size: 14px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d8b86a;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        a {
            display: inline-block;
            padding: 15px 25px;
            border: 1px solid #b99545;
            color: #f4f0e8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: 0.25s ease;
        }

        a.primary {
            background: #d8b86a;
            color: #080808;
        }

        a:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .footer {
            margin-top: 70px;
            color: #66635d;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <main class="success-wrapper">

        <div class="brand">LM</div>

        <p class="eyebrow">Enquiry Received</p>

        <h1>Thank you.</h1>

        <p class="message">
            Your enquiry has been successfully received.
            I appreciate you taking the time to reach out and share
            what you're building.
        </p>

        <div class="status">
            <span class="dot"></span>
            Your message has been submitted successfully
        </div>

        <div class="buttons">
            <a href="/" class="primary">Return Home</a>
            <a href="/ventures">Explore My Ventures</a>
        </div>

        <p class="footer">
            LYTON MUPANGA · CREATOR · ENTREPRENEUR · STRATEGIST
        </p>

    </main>

</body>
</html>
